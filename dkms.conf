# DKMS configuration for lockdown_hibernate kernel module
# Purpose: Manages hibernation with system lockdown capabilities
# Requires: kernel-headers, build-essential, gcc
# Supported: Linux 7.0+

PACKAGE_NAME="lockdown_hibernate"
PACKAGE_VERSION="0.1.0"
PACKAGE_RELEASE="1"

BUILT_MODULE_NAME[0]="${PACKAGE_NAME}"
DEST_MODULE_LOCATION[0]="/updates/dkms"

MAKE[0]="make KERNELRELEASE=${kernelver}"

AUTOINSTALL="yes"
